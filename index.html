<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
    <title>Progress Checker</title>

    <meta name="theme-color" content="#0f1109" />
    <meta name="description" content="Clean ProgressBook grades view, no login required" />

    <!-- iOS Add to Home Screen -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Progress Checker" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="./icons/favicon.svg" />
    <link rel="manifest" href="./manifest.webmanifest" />

    <style>
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html, body { margin: 0; padding: 0; background: #0f1109; overscroll-behavior-y: none; }
      body { padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); }
      button { font-family: inherit; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <!-- Bump ?v= on every deploy that changes app.js — GitHub Pages' CDN and
         browsers cache the plain URL, so this is what guarantees updates land. -->
    <script type="module" src="./app.js?v=4"></script>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js"));
      }
    </script>
  </body>
</html>
